<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23059669'/><text x='16' y='22' font-size='13' font-weight='bold' text-anchor='middle' fill='white'>ED</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 · 企业决策支持系统</title>
<meta name="description" content="注册企业决策支持系统账号，保存对话历史、管理会话分组，享受完整决策分析能力。">
<style>
    :root {
        --ink: #0b1220;
        --ink-2: #1e293b;
        --ink-3: #64748b;
        --ink-4: #94a3b8;
        --bg-2: #f8fafc;
        --bg-3: #f1f5f9;
        --line: #e6ebf2;
        --green: #059669;
        --green-2: #047857;
        --green-3: #10b981;
        --green-bg: #ecfdf5;
        --ease: cubic-bezier(.2,.7,.3,1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        color: var(--ink);
        background: #fff;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: grid;
        grid-template-columns: 1fr 1fr;
        overflow-x: hidden;
    }

    a { text-decoration: none; color: inherit; }
    button, input { font-family: inherit; }
    ::selection { background: rgba(5,150,105,.16); }

    .brand-side {
        position: relative;
        background: linear-gradient(160deg, #064e3b 0%, #065f46 42%, #047857 100%);
        color: #fff;
        padding: 44px 56px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
        isolation: isolate;
    }

    .brand-side::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
            linear-gradient(to right, rgba(255,255,255,.055) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255,255,255,.055) 1px, transparent 1px);
        background-size: 52px 52px;
        mask-image: radial-gradient(ellipse 76% 66% at 28% 26%, #000 24%, transparent 76%);
        -webkit-mask-image: radial-gradient(ellipse 76% 66% at 28% 26%, #000 24%, transparent 76%);
        z-index: -1;
    }

    .brand-side::after {
        content: '';
        position: absolute;
        bottom: -180px; right: -140px;
        width: 560px; height: 560px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(52,211,153,.28), transparent 66%);
        filter: blur(20px);
        z-index: -1;
    }

    .brand-logo { display: flex; align-items: center; gap: 11px; }

    .brand-logo .mark {
        width: 34px; height: 34px;
        border-radius: 10px;
        background: linear-gradient(140deg, #10b981, #34d399);
        display: grid; place-items: center;
        font-size: .74rem; font-weight: 800;
        letter-spacing: -.03em;
        box-shadow: 0 6px 18px -8px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.4);
    }

    .brand-logo span { font-size: .94rem; font-weight: 650; letter-spacing: -.012em; }

    .brand-body { position: relative; }

    .brand-body h2 {
        font-size: clamp(1.65rem, 2.6vw, 2.32rem);
        font-weight: 700;
        letter-spacing: -.038em;
        line-height: 1.24;
        margin-bottom: 18px;
    }

    .brand-body h2 em {
        font-style: normal;
        background: linear-gradient(100deg, #6ee7b7, #a7f3d0);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .brand-body > p {
        font-size: .92rem;
        color: rgba(255,255,255,.72);
        line-height: 1.8;
        max-width: 380px;
        margin-bottom: 34px;
    }

    .brand-list { list-style: none; display: grid; gap: 15px; }

    .brand-list li {
        display: flex;
        align-items: flex-start;
        gap: 11px;
        font-size: .865rem;
        color: rgba(255,255,255,.86);
        line-height: 1.65;
    }

    .brand-list .tick {
        flex: none;
        width: 19px; height: 19px;
        border-radius: 6px;
        background: rgba(255,255,255,.16);
        border: 1px solid rgba(255,255,255,.24);
        display: grid; place-items: center;
        font-size: .62rem; font-weight: 700;
        margin-top: 2px;
    }

    .brand-foot {
        font-size: .76rem;
        color: rgba(255,255,255,.5);
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
    }
    .brand-foot a { transition: color .16s var(--ease); }
    .brand-foot a:hover { color: #fff; }

    .form-side {
        display: grid;
        place-items: center;
        padding: 44px 32px;
    }

    .form-box {
        width: 100%;
        max-width: 384px;
        animation: boxIn .6s var(--ease) both;
    }

    @keyframes boxIn {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: none; }
    }

    .form-back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: .82rem;
        font-weight: 600;
        color: var(--ink-3);
        margin-bottom: 28px;
        transition: color .16s var(--ease), transform .16s var(--ease);
    }
    .form-back:hover { color: var(--green-2); transform: translateX(-2px); }

    .form-box h1 {
        font-size: 1.62rem;
        font-weight: 700;
        letter-spacing: -.032em;
        margin-bottom: 8px;
    }

    .form-box .sub {
        font-size: .885rem;
        color: var(--ink-3);
        margin-bottom: 30px;
    }
    .form-box .sub a {
        color: var(--green-2);
        font-weight: 600;
        border-bottom: 1px solid rgba(5,150,105,.3);
        transition: border-color .16s var(--ease);
    }
    .form-box .sub a:hover { border-bottom-color: var(--green); }

    .field { margin-bottom: 16px; }

    .field label {
        display: block;
        font-size: .82rem;
        font-weight: 600;
        color: var(--ink-2);
        margin-bottom: 7px;
    }

    .field .wrap { position: relative; }

    .field input[type="text"],
    .field input[type="email"],
    .field input[type="password"] {
        width: 100%;
        padding: 11px 15px;
        font-size: .9rem;
        color: var(--ink);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        outline: none;
        transition: border-color .18s var(--ease), box-shadow .18s var(--ease);
    }

    .field input::placeholder { color: var(--ink-4); }

    .field input:focus {
        border-color: #6ee7b7;
        box-shadow: 0 0 0 3px rgba(16,185,129,.14);
    }

    .field input.invalid {
        border-color: #fca5a5;
        box-shadow: 0 0 0 3px rgba(239,68,68,.1);
    }

    .field .toggle-pw {
        position: absolute;
        right: 6px; top: 50%;
        transform: translateY(-50%);
        width: 34px; height: 34px;
        border: none;
        background: transparent;
        color: var(--ink-4);
        cursor: pointer;
        border-radius: 8px;
        display: grid; place-items: center;
        transition: color .16s var(--ease), background .16s var(--ease);
    }
    .field .toggle-pw:hover { color: var(--ink-2); background: var(--bg-3); }

    .err {
        display: none;
        font-size: .76rem;
        color: #dc2626;
        margin-top: 6px;
    }
    .err.show { display: block; }

    /* 密码强度 */
    .strength {
        display: flex;
        gap: 4px;
        margin-top: 8px;
        opacity: 0;
        transition: opacity .24s var(--ease);
    }
    .strength.show { opacity: 1; }
    .strength i {
        flex: 1;
        height: 3px;
        border-radius: 100px;
        background: var(--line);
        transition: background .24s var(--ease);
    }
    .strength[data-level="1"] i:nth-child(1) { background: #f87171; }
    .strength[data-level="2"] i:nth-child(-n+2) { background: #fbbf24; }
    .strength[data-level="3"] i:nth-child(-n+3) { background: #34d399; }
    .strength[data-level="4"] i { background: var(--green); }

    .strength-txt {
        font-size: .72rem;
        color: var(--ink-4);
        margin-top: 5px;
        height: 0;
        overflow: hidden;
        transition: height .2s var(--ease);
    }
    .strength-txt.show { height: 18px; }

    .chk {
        display: inline-flex;
        align-items: flex-start;
        gap: 8px;
        font-size: .815rem;
        color: var(--ink-3);
        cursor: pointer;
        user-select: none;
        line-height: 1.6;
        margin: 6px 0 22px;
    }

    .chk input {
        appearance: none;
        -webkit-appearance: none;
        width: 16px; height: 16px;
        border: 1px solid #cbd5e1;
        border-radius: 5px;
        background: #fff;
        cursor: pointer;
        position: relative;
        flex: none;
        margin-top: 2px;
        transition: background .16s var(--ease), border-color .16s var(--ease);
    }

    .chk input:checked {
        background: var(--green);
        border-color: var(--green);
    }

    .chk input:checked::after {
        content: '';
        position: absolute;
        left: 5px; top: 1.5px;
        width: 4px; height: 8px;
        border: solid #fff;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
    }

    .chk a {
        color: var(--green-2);
        font-weight: 500;
        border-bottom: 1px solid rgba(5,150,105,.3);
    }
    .chk a:hover { border-bottom-color: var(--green); }

    .btn-submit {
        width: 100%;
        padding: 12px 20px;
        font-size: .905rem;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(160deg, #059669, #047857);
        border: 1px solid transparent;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 10px 24px -12px rgba(5,150,105,.7), inset 0 1px 0 rgba(255,255,255,.2);
        transition: transform .18s var(--ease), box-shadow .18s var(--ease), background .18s var(--ease);
    }

    .btn-submit:hover:not(:disabled) {
        transform: translateY(-1px);
        background: linear-gradient(160deg, #10b981, #059669);
        box-shadow: 0 14px 30px -12px rgba(5,150,105,.75), inset 0 1px 0 rgba(255,255,255,.24);
    }

    .btn-submit:disabled {
        opacity: .62;
        cursor: not-allowed;
        box-shadow: none;
    }

    .divider {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 22px 0;
        font-size: .76rem;
        color: var(--ink-4);
    }
    .divider::before, .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--line);
    }

    .btn-ghost-full {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 11px 20px;
        font-size: .88rem;
        font-weight: 600;
        color: var(--ink-2);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        cursor: pointer;
        transition: background .18s var(--ease), border-color .18s var(--ease), transform .18s var(--ease);
    }
    .btn-ghost-full:hover {
        background: var(--bg-2);
        border-color: #cbd5e1;
        transform: translateY(-1px);
    }

    .toast {
        position: fixed;
        left: 50%;
        bottom: 32px;
        transform: translate(-50%, 16px);
        background: #0b1220;
        color: #fff;
        font-size: .855rem;
        padding: 11px 20px;
        border-radius: 10px;
        box-shadow: 0 18px 40px -18px rgba(15,23,42,.7);
        opacity: 0;
        pointer-events: none;
        transition: opacity .28s var(--ease), transform .28s var(--ease);
        z-index: 400;
        max-width: calc(100vw - 40px);
        text-align: center;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 940px) {
        body { grid-template-columns: 1fr; }
        .brand-side { display: none; }
        .form-side { padding: 40px 22px; min-height: 100vh; align-content: center; }
    }
</style>
</head>
<body>

<aside class="brand-side">
    <a href="./index.html" class="brand-logo">
        <div class="mark">ED</div>
        <span>企业决策支持系统</span>
    </a>

    <div class="brand-body">
        <h2>从今天开始<br><em>让决策有据可查</em></h2>
        <p>注册后即可保存全部对话与决策记录，随时回溯当时的条件、策略与历史依据。</p>
        <ul class="brand-list">
            <li><span class="tick">✓</span><span>永久保存对话历史，支持按行业与主题分组</span></li>
            <li><span class="tick">✓</span><span>解锁完整分析链路，输出案例引用与适用边界</span></li>
            <li><span class="tick">✓</span><span>参与产品共建，你的反馈会进入下一轮迭代</span></li>
        </ul>
    </div>

    <div class="brand-foot">
        <a href="./terms.html">服务条款</a>
        <a href="./privacy.html">隐私政策</a>
        <a href="./about.html">关于我们</a>
    </div>
</aside>

<main class="form-side">
    <div class="form-box">
        <a href="./index.html" class="form-back">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
            返回首页
        </a>

        <h1>创建账号</h1>
        <p class="sub">已有账号？<a href="./login.html">直接登录</a></p>

        <form id="regForm" novalidate>
            <div class="field">
                <label for="username">用户名</label>
                <input type="text" id="username" placeholder="2-20 个字符" autocomplete="username">
                <div class="err" id="err-username">用户名至少 2 个字符</div>
            </div>

            <div class="field">
                <label for="email">邮箱</label>
                <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
                <div class="err" id="err-email">请输入有效的邮箱地址</div>
            </div>

            <div class="field">
                <label for="password">密码</label>
                <div class="wrap">
                    <input type="password" id="password" placeholder="至少 8 位，含字母与数字" autocomplete="new-password" style="padding-right:46px;">
                    <button type="button" class="toggle-pw" id="togglePw" aria-label="显示密码">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
                <div class="strength" id="strength"><i></i><i></i><i></i><i></i></div>
                <div class="strength-txt" id="strengthTxt"></div>
                <div class="err" id="err-password">密码至少 8 位，且需同时包含字母与数字</div>
            </div>

            <div class="field">
                <label for="password2">确认密码</label>
                <input type="password" id="password2" placeholder="请再次输入密码" autocomplete="new-password">
                <div class="err" id="err-password2">两次输入的密码不一致</div>
            </div>

            <label class="chk">
                <input type="checkbox" id="agree">
                <span>我已阅读并同意<a href="./terms.html" target="_blank">《服务条款》</a>与<a href="./privacy.html" target="_blank">《隐私政策》</a></span>
            </label>
            <div class="err" id="err-agree" style="margin:-16px 0 16px;">请先阅读并同意相关条款</div>

            <button type="submit" class="btn-submit" id="submitBtn">注册</button>
        </form>

        <div class="divider">或</div>

        <button type="button" class="btn-ghost-full" id="guestBtn">
            免登录体验
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
    </div>
</main>

<div class="toast" id="toast"></div>

<script>
    const toastEl = document.getElementById('toast');
    let toastTimer = null;

    function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2800);
    }

    /* 密码显隐 */
    const pw = document.getElementById('password');
    const togglePw = document.getElementById('togglePw');
    togglePw.addEventListener('click', () => {
        const show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        togglePw.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
        togglePw.style.color = show ? 'var(--green-2)' : '';
    });

    /* 密码强度 */
    const strengthEl = document.getElementById('strength');
    const strengthTxt = document.getElementById('strengthTxt');
    const LABELS = ['', '弱', '一般', '较强', '很强'];

    pw.addEventListener('input', () => {
        const v = pw.value;
        if (!v) {
            strengthEl.classList.remove('show');
            strengthTxt.classList.remove('show');
            return;
        }
        let score = 0;
        if (v.length >= 8) score++;
        if (/[a-zA-Z]/.test(v) && /\d/.test(v)) score++;
        if (/[^a-zA-Z0-9]/.test(v)) score++;
        if (v.length >= 12) score++;
        score = Math.max(1, Math.min(4, score));

        strengthEl.classList.add('show');
        strengthEl.dataset.level = score;
        strengthTxt.classList.add('show');
        strengthTxt.textContent = '密码强度：' + LABELS[score];
    });

    /* 校验 */
    const form = document.getElementById('regForm');
    const username = document.getElementById('username');
    const email = document.getElementById('email');
    const password2 = document.getElementById('password2');
    const agree = document.getElementById('agree');
    const submitBtn = document.getElementById('submitBtn');

    const errs = {
        username: document.getElementById('err-username'),
        email: document.getElementById('err-email'),
        password: document.getElementById('err-password'),
        password2: document.getElementById('err-password2'),
        agree: document.getElementById('err-agree')
    };

    function setErr(input, key, on) {
        if (input) input.classList.toggle('invalid', on);
        errs[key].classList.toggle('show', on);
    }

    username.addEventListener('input', () => setErr(username, 'username', false));
    email.addEventListener('input', () => setErr(email, 'email', false));
    pw.addEventListener('input', () => setErr(pw, 'password', false));
    password2.addEventListener('input', () => setErr(password2, 'password2', false));
    agree.addEventListener('change', () => errs.agree.classList.remove('show'));

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        let ok = true;

        if (username.value.trim().length < 2) { setErr(username, 'username', true); ok = false; }

        const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
        if (!emailOk) { setErr(email, 'email', true); ok = false; }

        const pwOk = pw.value.length >= 8 && /[a-zA-Z]/.test(pw.value) && /\d/.test(pw.value);
        if (!pwOk) { setErr(pw, 'password', true); ok = false; }

        if (password2.value !== pw.value || !password2.value) { setErr(password2, 'password2', true); ok = false; }

        if (!agree.checked) { errs.agree.classList.add('show'); ok = false; }

        if (!ok) {
            const firstBad = [username, email, pw, password2].find(el => el.classList.contains('invalid'));
            if (firstBad) firstBad.focus();
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = '注册中…';

        // 后端接口尚未就绪，此处为占位交互
        setTimeout(() => {
            submitBtn.disabled = false;
            submitBtn.textContent = '注册';
            toast('后端接口尚未接入，暂时无法完成注册');
        }, 900);
    });

    document.getElementById('guestBtn').addEventListener('click', () => {
        window.location.href = './function.html';
    });
</script>
</body>
</html>
